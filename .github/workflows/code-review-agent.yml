name: Code Review Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  packages: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Run code-review-agent
        uses: infiniumtek/code-review-agent/examples/github-action@main
        with:
          # Replace this with the worker image you build and publish from
          # infiniumtek/code-review-agent.
          image: ghcr.io/infiniumtek/code-review-agent:latest
          provider: openai
          model: gpt-5
          llm-api-key: ${{ secrets.OPENAI_API_KEY }}
          reporter: github
          fail-on: high
